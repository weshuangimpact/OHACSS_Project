<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>OHACSS 系統入口</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .box {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 360px;
        }
        .status {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #666;
        }
        .error {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>OHACSS 系統啟動中</h2>
    <p>正在檢查登入頁面...</p>
    <div id="status" class="status">初始化中...</div>
</div>

<script>
(async function () {
    const statusEl = document.getElementById("status");

    try {
        statusEl.innerText = "檢查 login.html 是否存在...";

        const response = await fetch("login.html", { method: "HEAD" });

        if (!response.ok) {
            throw new Error("login.html 無法載入 (HTTP " + response.status + ")");
        }

        statusEl.innerText = "檢查成功，2 秒後進入登入頁...";

        setTimeout(() => {
            window.location.href = "login.html";
        }, 2000);

    } catch (err) {
        statusEl.innerHTML =
            `<div class="error">發生錯誤：${err.message}</div>
             <p>請確認 login.html 是否存在於專案根目錄。</p>
             <a href="login.html">點此嘗試手動進入</a>`;
        console.error(err);
    }
})();
</script>

</body>
</html>
