<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>系統導向中...</title>
    <script>
        // ========================================================
        // 系統路由分發中心
        // ========================================================

        // 1. 【優先檢查】：這是不是 Supabase 的密碼重設回調 (Recovery)?
        // 當使用者點擊 Email 連結，網址會帶有 #access_token=...&type=recovery
        const hash = window.location.hash;

        if (hash && hash.includes('type=recovery')) {
            console.log('偵測到密碼重設請求，正在轉導至重設頁面...');
            
            // 關鍵動作：將帶著 Token 的 Hash 原封不動傳給 reset_password.html
            // 這樣 reset_password.html 裡面的 Supabase Client 才能抓到 Session
            window.location.replace('reset_password.html' + hash);
        } 
        // 2. 【標準檢查】：一般使用者的登入狀態判斷
        else {
            const userId = sessionStorage.getItem('currentUserId');

            if (userId) {
                // 情境 A: 已登入 -> 直接送去儀表板
                window.location.replace('dashboard.html');
            } else {
                // 情境 B: 未登入 -> 送去登入頁
                window.location.replace('login.html');
            }
        }
    </script>
</head>
<body>
</body>
</html>
