<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工作儀表板 | OHACSS 職業健康評鑑與合規支援系統</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <link href="css/global.css" rel="stylesheet">
    <link href="css/dashboard.css" rel="stylesheet">
</head>
<body>

    <div id="app-header"></div>

    <div class="container py-5 main-wrapper">
        <div class="row mb-4">
            <div class="col-12">
                <h2 class="fw-bold text-dark">
                    <i class="fas fa-tachometer-alt me-2 text-primary"></i>工作儀表板
                </h2>
                <p class="text-muted">
                    歡迎回來，<span id="user-name" class="fw-bold text-dark">...</span>。請選擇您要執行的作業。
                </p>
            </div>
        </div>

        <div class="row g-4">
            
            <div class="col-md-6 col-lg-3">
                <div class="card h-100 dashboard-card card-service p-3">
                    <div class="card-body text-center">
                        <div class="icon-box mx-auto">
                            <i class="fas fa-clipboard-list"></i>
                        </div>
                        <h5 class="card-title fw-bold">服務執行歷程</h5>
                        <p class="card-text text-muted small">Plan & Do<br>管理臨場服務與執行紀錄</p>
                        <a href="index1.html" class="btn btn-outline-primary w-100 mt-3 stretched-link">進入管理</a>
                    </div>
                </div>
            </div>

            <div class="col-md-6 col-lg-3">
                <div class="card h-100 dashboard-card card-ai p-3">
                    <div class="card-body text-center">
                        <div class="icon-box mx-auto">
                            <i class="fas fa-robot"></i>
                        </div>
                        <h5 class="card-title fw-bold">AI 智能助手</h5>
                        <p class="card-text text-muted small">Check & Action<br>自動化評估與建議生成</p>
                        <a href="index2.html" class="btn btn-outline-success w-100 mt-3 stretched-link">啟動 AI</a>
                    </div>
                </div>
            </div>

            <div class="col-md-6 col-lg-3">
                <div class="card h-100 dashboard-card card-admin p-3">
                    <div class="card-body text-center">
                        <div class="icon-box mx-auto">
                            <i class="fas fa-users-cog"></i>
                        </div>
                        <h5 class="card-title fw-bold">帳號權限管理</h5>
                        <p class="card-text text-muted small">Admin Only<br>管理使用者角色與權限</p>
                        <a href="index7.html" class="btn btn-outline-danger w-100 mt-3 stretched-link">人員管理</a>
                    </div>
                </div>
            </div>

            <div class="col-md-6 col-lg-3">
                <div class="card h-100 dashboard-card card-system p-3">
                    <div class="card-body text-center">
                        <div class="icon-box mx-auto">
                            <i class="fas fa-user-cog"></i>
                        </div>
                        <h5 class="card-title fw-bold">個人設定</h5>
                        <p class="card-text text-muted small">Profile<br>修改密碼與個人資訊</p>
                        <a href="profile_settings.html" class="btn btn-outline-secondary w-100 mt-3 stretched-link">設定</a>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <div id="app-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/dashboard.js"></script>

</body>
</html>
